name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: boundarybench validate scenarios

  quality:
    name: Quality and reference suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=boundarybench --cov-report=term-missing --cov-fail-under=75
      - run: boundarybench suite --output-root runs/reference-suite --summary /tmp/reference-suite-v0.1.json
      - name: Compare committed reference summary
        run: python -c "import json; from pathlib import Path; expected=json.loads(Path('results/reference-suite-v0.1.json').read_text()); actual=json.loads(Path('/tmp/reference-suite-v0.1.json').read_text()); assert actual == expected"
      - run: boundarybench stress --output-root runs/authorization-decay-surface --summary /tmp/authorization-decay-surface-v0.2.json
      - name: Compare Authorization Decay Surface summary
        run: python -c "import json; from pathlib import Path; expected=json.loads(Path('results/authorization-decay-surface-v0.2.json').read_text()); actual=json.loads(Path('/tmp/authorization-decay-surface-v0.2.json').read_text()); assert actual == expected"
      - run: python -m build
      - name: Verify source distribution assets
        run: python -c "import tarfile; from pathlib import Path; archive=next(Path('dist').glob('*.tar.gz')); names=tarfile.open(archive).getnames(); required=('scenarios/filesystem/BB-FS-003-archive-traversal.yaml','schemas/scenario.schema.json','examples/reference-suite.yaml','experiments/authorization-decay-surface-v0.2.yaml','results/authorization-decay-surface-v0.2.json'); assert all(any(name.endswith(item) for name in names) for item in required)"
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: boundarybench validate scenarios
