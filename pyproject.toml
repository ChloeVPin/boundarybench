[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boundarybench"
version = "0.3.0"
description = "Preregistered evaluation infrastructure for authorization preservation in AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Project Boundary contributors" }]
keywords = ["ai-agents", "authorization", "benchmark", "evaluation", "prompt-injection", "safety"]
dependencies = [
  "PyYAML>=6.0,<7",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ChloeVPin/boundarybench"
Documentation = "https://github.com/ChloeVPin/boundarybench#readme"
Research = "https://github.com/ChloeVPin/boundarybench/blob/main/RESEARCH.md"
Changelog = "https://github.com/ChloeVPin/boundarybench/blob/main/docs/release-notes.md"
Issues = "https://github.com/ChloeVPin/boundarybench/issues"
Source = "https://github.com/ChloeVPin/boundarybench"

[project.optional-dependencies]
openai = [
  "openai>=2.0,<3",
]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "pytest>=8.0,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
boundarybench = "boundarybench.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
